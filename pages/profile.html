<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Property.pk</title>

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/home.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>

<body>

  <div id="navbar-root"></div>
  <div id="page-header-root"></div>

  <main class="static-page">
   <div class="static-page-card">

    <span class="page-eyebrow">Account</span>
    <h1 style="margin-top:6px;">My Profile</h1>
    <p class="auth-subtitle" style="text-align:left; margin-bottom:20px;">View and update your account information.</p>

    <div id="profileMessage"></div>

    <form class="auth-form" id="profileForm">
      <div class="form-group">
        <label for="profileName">Full Name</label>
        <input type="text" id="profileName" placeholder="Your full name" required>
      </div>
      <div class="form-group">
        <label for="profileEmail">Email</label>
        <input type="email" id="profileEmail" disabled>
      </div>
      <div class="form-group">
        <label for="profileRole">Account Type</label>
        <select id="profileRole">
          <option value="buyer">Buyer / Renter</option>
          <option value="seller">Seller / Property Owner</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
    </form>

    <div class="highlight-box" style="margin-top:24px;">
      <h3>Account Security</h3>
      <p>Want to change your password? <a href="./auth/forgot-password.html">Reset it here</a>.</p>
    </div>

   </div>
  </main>

  <div id="footer-root"></div>

  <script src="../assets/js/utils/constants.js"></script>
  <script src="../assets/js/utils/helpers.js"></script>
  <script src="../assets/js/utils/validator.js"></script>
  <script src="../assets/js/utils/storage.js"></script>

  <script src="../assets/js/api/config.js"></script>
  <script src="../assets/js/api/authApi.js"></script>

  <script src="../assets/js/components/navbar.js"></script>
  <script src="../assets/js/components/footer.js"></script>
  <script src="../assets/js/components/backButton.js"></script>

<script src="../assets/js/pages/profile.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderPageHeader("My Profile");
    });
  </script>
  </body>

        </html>

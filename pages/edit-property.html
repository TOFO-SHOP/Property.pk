<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Property - Property.pk</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/home.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>

<body>

  <div id="navbar-root"></div>
  <div id="page-header-root"></div>

  <main class="static-page">
   <div class="static-page-card">

    <span class="page-eyebrow">Seller Tools</span>
    <h1 style="margin-top:6px;">Edit Property</h1>
    <p class="auth-subtitle" style="text-align:left; margin-bottom:24px;">Update your listing details below.</p>

    <div id="epMessage"></div>

    <form class="auth-form" id="editPropertyForm">

      <h2 style="font-size:16px; margin-top:0;">Basic Information</h2>

      <div class="form-group">
        <label for="epStatus">Listing Type</label>
        <select id="epStatus" required>
          <option value="For Sale">For Sale</option>
          <option value="For Rent">For Rent</option>
        </select>
      </div>

      <div class="form-group">
        <label for="epType">Property Type</label>
        <select id="epType" required>
          <option value="House">House</option>
          <option value="Flat">Flat</option>
          <option value="Apartment">Apartment</option>
          <option value="Plot">Plot</option>
          <option value="Commercial">Commercial</option>
        </select>
      </div>

      <div class="form-group">
        <label for="epTitle">Listing Title</label>
        <input type="text" id="epTitle" required>
      </div>

      <div class="form-group">
        <label for="epDescription">Description</label>
        <textarea id="epDescription" rows="4" required></textarea>
      </div>

      <h2 style="font-size:16px;">Location</h2>

      <div class="form-group">
        <label for="epCity">City</label>
        <select id="epCity" required>
          <option value="">Select city</option>
        </select>
      </div>

      <div class="form-group">
        <label for="epArea">Area / Neighborhood</label>
        <input type="text" id="epArea" required>
      </div>

      <h2 style="font-size:16px;">Price & Size</h2>

      <div class="form-group">
        <label for="epPrice">Price (PKR)</label>
        <input type="number" id="epPrice" required min="1">
      </div>

      <div class="form-group">
        <label for="epMarla">Size (Marla)</label>
        <input type="number" id="epMarla" required min="1">
      </div>

      <div class="form-group">
        <label for="epBedrooms">Bedrooms</label>
        <input type="number" id="epBedrooms" required min="0">
      </div>

      <div class="form-group">
        <label for="epBathrooms">Bathrooms</label>
        <input type="number" id="epBathrooms" required min="0">
      </div>

      <div class="form-group">
        <label for="epFloors">Stories</label>
        <select id="epFloors">
          <option value="Single Story">Single Story</option>
          <option value="Double Story">Double Story</option>
          <option value="Triple Story">Triple Story</option>
        </select>
      </div>

      <h2 style="font-size:16px;">Amenities</h2>

      <div class="amenities-grid">
        <label class="amenity-check"><input type="checkbox" id="epParking"><span>Parking</span></label>
        <label class="amenity-check"><input type="checkbox" id="epGas"><span>Gas</span></label>
        <label class="amenity-check"><input type="checkbox" id="epElectricityBackup"><span>Electricity Backup</span></label>
        <label class="amenity-check"><input type="checkbox" id="epWaterSupply"><span>Water Supply</span></label>
        <label class="amenity-check"><input type="checkbox" id="epSecurity"><span>Security / Guard</span></label>
        <label class="amenity-check"><input type="checkbox" id="epElevator"><span>Elevator</span></label>
        <label class="amenity-check"><input type="checkbox" id="epGarden"><span>Garden / Lawn</span></label>
        <label class="amenity-check"><input type="checkbox" id="epFurnished"><span>Furnished</span></label>
      </div>

      <h2 style="font-size:16px;">Photos</h2>

      <div class="form-group">
        <label for="epImages">Image URLs (comma-separated)</label>
        <textarea id="epImages" rows="3" required></textarea>
      </div>

      <h2 style="font-size:16px;">Contact Information</h2>

      <div class="form-group">
        <label for="epPhone">Contact Phone</label>
        <input type="tel" id="epPhone" required>
      </div>

      <div class="form-group">
        <label for="epWhatsapp">WhatsApp Number (optional)</label>
        <input type="tel" id="epWhatsapp">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Save Changes</button>

    </form>

   </div>
  </main>

  <div id="footer-root"></div>

  <script src="../assets/js/utils/constants.js"></script>
  <script src="../assets/js/utils/helpers.js"></script>
  <script src="../assets/js/utils/validator.js"></script>
  <script src="../assets/js/utils/storage.js"></script>
  <script src="../assets/js/api/config.js"></script>
  <script src="../assets/js/api/authApi.js"></script>
  <script src="../assets/js/components/navbar.js"></script>
  <script src="../assets/js/components/footer.js"></script>
  <script src="../assets/js/components/backButton.js"></script>
  <script src="../assets/js/pages/edit-property.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderPageHeader("Edit Property");
    });
  </script>
</body>

    </html>

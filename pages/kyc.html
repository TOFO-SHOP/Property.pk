<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a2540">
  <meta name="description" content="Complete your seller KYC on Property.pk. Verified sellers get a badge and higher visibility in search results.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Seller Verification (KYC) - Property.pk">
  <meta property="og:description" content="Verify your identity to become a trusted seller on Property.pk.">
  <meta name="twitter:card" content="summary">

  <title>Seller Verification (KYC) - Property.pk</title>

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/home.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>

<body>

  <div id="navbar-root"></div>
  <div id="page-header-root"></div>

  <main class="static-page" id="mainContent">
    <section class="static-page-card" aria-labelledby="kycTitle">

      <span class="page-eyebrow">Seller Verification</span>
      <h1 id="kycTitle" style="margin-top:6px;">Complete Your KYC</h1>
      <p class="auth-subtitle" style="text-align:left; margin-bottom:24px;">
        Verified sellers get a &ldquo;Verified&rdquo; badge and appear higher in search results.
        This information is kept private and secure.
      </p>

      <div id="kycMessage" role="status" aria-live="polite"></div>

      <form class="auth-form" id="kycForm" novalidate enctype="multipart/form-data">

        <div class="form-group">
          <label for="kycCnic">CNIC Number</label>
          <input type="text" id="kycCnic" name="cnic"
            placeholder="XXXXX-XXXXXXX-X" maxlength="15"
            pattern="[0-9]{5}-[0-9]{7}-[0-9]" inputmode="numeric"
            autocomplete="off" required
            aria-describedby="cnicHelp">
          <small id="cnicHelp" style="color:var(--color-text-muted); font-size:12px;">Format: 35202-1234567-1</small>
        </div>

        <div class="form-group">
          <span class="form-label" id="labelCnicFront">CNIC Front Photo</span>
          <label class="upload-box" for="kycCnicFront">
            <div class="upload-box-preview" id="previewCnicFront">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" focusable="false"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="9" cy="12" r="2"/><path d="m21 15-4-4-9 9"/></svg>
              <span>Tap to upload CNIC front</span>
            </div>
            <input type="file" id="kycCnicFront" name="cnicFront" accept="image/*" required style="display:none;" aria-labelledby="labelCnicFront">
          </label>
        </div>

        <div class="form-group">
          <span class="form-label" id="labelCnicBack">CNIC Back Photo</span>
          <label class="upload-box" for="kycCnicBack">
            <div class="upload-box-preview" id="previewCnicBack">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" focusable="false"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="9" cy="12" r="2"/><path d="m21 15-4-4-9 9"/></svg>
              <span>Tap to upload CNIC back</span>
            </div>
            <input type="file" id="kycCnicBack" name="cnicBack" accept="image/*" required style="display:none;" aria-labelledby="labelCnicBack">
          </label>
        </div>

        <div class="form-group">
          <span class="form-label" id="labelSelfie">Selfie Photo</span>
          <label class="upload-box" for="kycSelfie">
            <div class="upload-box-preview" id="previewSelfie">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
              <span>Tap to upload a clear selfie</span>
            </div>
            <input type="file" id="kycSelfie" name="selfie" accept="image/*" capture="user" required style="display:none;" aria-labelledby="labelSelfie">
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Submit for Verification</button>

      </form>

    </section>
  </main>

  <div id="footer-root"></div>

  <script src="../assets/js/utils/constants.js"></script>
  <script src="../assets/js/utils/helpers.js"></script>
  <script src="../assets/js/utils/validator.js"></script>
  <script src="../assets/js/utils/storage.js"></script>
  <script src="../assets/js/api/config.js"></script>
  <script src="../assets/js/api/authApi.js"></script>
  <script src="../assets/js/components/navbar.js"></script>
  <script src="../assets/js/components/footer.js"></script>
  <script src="../assets/js/components/backButton.js"></script>
  <script src="../assets/js/pages/kyc.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderPageHeader("Seller Verification");
    });
  </script>
</body>

</html>
